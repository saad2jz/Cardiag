<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Redirection CarDiag…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #0b0a09; color: #f7f5f2; font-family: system-ui, sans-serif; }
    main { width: min(100%, 640px); text-align: center; }
    img { display: block; width: 100%; height: auto; border-radius: 18px; margin: 0 auto 20px; }
    p { margin: 0; color: #c5c0b7; }
  </style>
</head>
<body>
  <script>
    // GitHub Pages serves this file for unknown paths. Restore internal SPA
    // routes through the root document, which owns the History API router.
    (function () {
      var route = location.pathname + location.search + location.hash;
      if (/^\/(?:app|fiche)(?:\/|$)/.test(location.pathname) || location.pathname === '/exemple-rapport') {
        location.replace('/?_r=' + encodeURIComponent(route));
      } else if (/^\/r\/[A-Za-z0-9_-]{20,80}$/.test(location.pathname)) {
        location.replace('/shared-report.html?token=' + encodeURIComponent(location.pathname.split('/').pop()));
      } else if (/^\/(?:privacy|terms|account-deletion)$/.test(location.pathname)) {
        location.replace(location.pathname + '.html' + location.search + location.hash);
      }
    }());
  </script>
  <main>
    <img src="/assets/landing/404-illustration.webp" width="1200" height="655" alt="Illustration d’un véhicule avec un point d’interrogation, indiquant une page introuvable">
  <p>Chargement de CarDiag…</p>
  </main>
</body>
</html>
