<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration garages | CarDiag</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/marketplace.css"></head>
<body><header class="garage-header"><a href="/">CarDiag</a><a href="/garages">Annuaire garages</a></header><main class="garage-page"><p class="garage-kicker">ADMINISTRATION</p><h1>Garages et avis</h1><p id="adminStatus" role="status">Vérification de vos droits…</p><section class="garage-admin-grid"><form id="adminGarageForm" class="garage-form"><h2>Créer une fiche garage</h2><label>Nom *<input name="name" required maxlength="120"></label><label>Ville *<input name="city" required maxlength="100"></label><label>Adresse<input name="address" maxlength="200"></label><label>Code postal<input name="postalCode" maxlength="12"></label><label>Spécialités<input name="specialties" maxlength="600"></label><label>Horaires<textarea name="hours" maxlength="1000"></textarea></label><label>Description<textarea name="description" maxlength="2000"></textarea></label><label>Contact<input name="phone" maxlength="30"></label><label>Email<input name="email" type="email" maxlength="254"></label><label>Statut<select name="status"><option value="active">Actif immédiatement</option><option value="pending">À compléter plus tard</option></select></label><button>Créer le garage</button></form><section><h2>Candidatures garages</h2><div id="adminGarages"></div><h2>Avis en attente</h2><div id="adminReviews"></div></section></section></main><script type="module" src="/js/marketplace/garage-admin.js"></script></body></html>
