<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscrire mon garage | CarDiag</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/css/marketplace.css"></head>
<body><header class="garage-header"><a href="/">CarDiag</a><a href="/garages">Annuaire garages</a></header><main class="garage-page"><p class="garage-kicker">ESPACE PROFESSIONNEL</p><h1>Inscrire mon garage</h1><p>Votre fiche sera examinée avant sa publication dans l’annuaire CarDiag.</p><form id="garageRegistration" class="garage-form"><label>Nom du garage *<input name="name" maxlength="120" required></label><label>Adresse<input name="address" maxlength="200"></label><label>Ville *<input name="city" maxlength="100" required></label><label>Code postal<input name="postalCode" maxlength="12"></label><label>Spécialités (séparées par des virgules)<input name="specialties" maxlength="600" placeholder="Mécanique, freinage, diagnostic"></label><label>Horaires<textarea name="hours" maxlength="1000"></textarea></label><label>Description<textarea name="description" maxlength="2000"></textarea></label><label>Téléphone<input name="phone" maxlength="30" inputmode="tel"></label><label>Email<input name="email" maxlength="254" type="email"></label><label>Site web<input name="website" maxlength="240" type="url"></label><button>Envoyer ma candidature</button><p id="garageRegistrationStatus" role="status"></p></form></main><script type="module" src="/js/marketplace/garage-registration.js"></script></body></html>
